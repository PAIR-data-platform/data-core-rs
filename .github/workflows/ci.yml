name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Pinned so that lints added in new Rust releases do not break CI unannounced.
  # Bump deliberately after running `cargo clippy --workspace --all-targets` on the new version.
  RUST_TOOLCHAIN: "1.94.0"
  # FFmpeg 6.1 on Ubuntu 24.04; ffmpeg-sys-next generates its bindings with bindgen.
  APT_PACKAGES: >-
    libavcodec-dev libavformat-dev libavutil-dev libavfilter-dev
    libavdevice-dev libswscale-dev libswresample-dev
    pkg-config clang libclang-dev

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt
      - run: cargo fmt --all --check

  rust:
    name: clippy and cargo test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install FFmpeg development libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends $APT_PACKAGES
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: Build the API docs
        run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  python:
    name: wheel and pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - name: Install FFmpeg development libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends $APT_PACKAGES
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: python-${{ matrix.python-version }}
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Build the wheel
        run: |
          python -m pip install --upgrade pip
          python -m pip install "maturin>=1.0,<2.0"
          maturin build --compatibility linux --out dist
      - name: Install the wheel, pytest and CPU-only PyTorch
        # CPU torch (about 200 MB) lets the PyTorch frontend tests run instead of skipping.
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install "$(ls dist/*.whl)[dev]"
      - name: Run pytest
        run: python -m pytest -v
